<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Fast-LeWM 方案A 异构调度实验图表（三方对比）</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; margin: 20px; background: #f5f5f5; }
h1 { text-align: center; color: #333; font-size: 20px; }
h2 { color: #444; font-size: 15px; margin-top: 30px; border-left: 4px solid #5470c6; padding-left: 10px; }
.chart { background: white; border-radius: 8px; padding: 15px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.note { font-size: 12px; color: #888; margin-top: 8px; }
</style>
</head>
<body>
<h1>Fast-LeWM 方案 A 异构调度实验结果（三方对比）</h1>
<p style="text-align:center;color:#666;font-size:13px;">RK3588 / 4×A76绑核 / NPU 1GHz / FP16 / batch=300 / 30iter×3rep</p>

<h2>图1：三方端到端延迟对比与加速比</h2>
<div class="chart"><div id="chart1" style="width:100%;height:400px;"></div></div>

<h2>图2：各阶段延迟分解（CPU / NPU全量 / NPU异构）</h2>
<div class="chart"><div id="chart2" style="width:100%;height:420px;"></div></div>

<h2>图3：NPU 每步细粒度开销（异构 vs 全量）</h2>
<div class="chart"><div id="chart3" style="width:100%;height:380px;"></div></div>

<h2>图4：NPU 模式下 CPU 性能下降幅度</h2>
<div class="chart"><div id="chart4" style="width:100%;height:380px;"></div></div>

<script>
// 图1：三方端到端延迟对比
var c1 = echarts.init(document.getElementById('chart1'));
c1.setOption({
  backgroundColor: 'transparent',
  tooltip: { trigger: 'axis', triggerOn: 'mousemove|click', renderMode: 'richText', confine: true },
  legend: { data: ['完整CEM决策', 'rollout(5步×30iter)'], top: 5 },
  grid: { left: 60, right: 40, top: 50, bottom: 40, containLabel: true },
  xAxis: { type: 'category', data: ['CPU 全量', 'NPU 全量\n(enc+pred都NPU)', 'NPU 异构(方案A)\n(CPU enc+NPU pred)'] },
  yAxis: { type: 'value', name: '延迟 (s)', nameLocation: 'middle', nameGap: 45 },
  series: [
    { name: '完整CEM决策', type: 'bar', data: [20.09, 10.49, 8.95], itemStyle: { color: '#5470c6' }, label: { show: true, position: 'top', formatter: '{c}s' }, barWidth: '30%' },
    { name: 'rollout(5步×30iter)', type: 'bar', data: [16.59, 4.58, 3.40], itemStyle: { color: '#91cc75' }, label: { show: true, position: 'top', formatter: '{c}s' }, barWidth: '30%' }
  ],
  graphic: [
    { type: 'text', left: '72%', top: '35%', style: { text: '异构 vs CPU: 2.25×', fontSize: 16, fontWeight: 'bold', fill: '#ee6666' } },
    { type: 'text', left: '72%', top: '45%', style: { text: '异构 vs 全量: 1.17×', fontSize: 14, fontWeight: 'bold', fill: '#fac858' } },
    { type: 'text', left: '72%', top: '55%', style: { text: '全量 vs CPU: 1.92×', fontSize: 12, fill: '#999' } }
  ]
});

// 图2：各阶段延迟分解（三方）
var c2 = echarts.init(document.getElementById('chart2'));
c2.setOption({
  backgroundColor: 'transparent',
  tooltip: { trigger: 'axis', triggerOn: 'mousemove|click', renderMode: 'richText', confine: true, axisPointer: { type: 'shadow' } },
  legend: { data: ['vi_enc(视觉编码)', 'action_encoder', 'rollout(模型计算)', '其他(score/elite/sample)'], top: 5 },
  grid: { left: 60, right: 40, top: 50, bottom: 40, containLabel: true },
  xAxis: { type: 'category', data: ['CPU 全量', 'NPU 全量', 'NPU 异构(方案A)'] },
  yAxis: { type: 'value', name: '延迟 (ms)', nameLocation: 'middle', nameGap: 45 },
  series: [
    { name: 'vi_enc(视觉编码)', type: 'bar', stack: 'total', data: [3914, 7334, 5151], itemStyle: { color: '#ee6666' } },
    { name: 'action_encoder', type: 'bar', stack: 'total', data: [2982, 5466, 4897], itemStyle: { color: '#fac858' } },
    { name: 'rollout(模型计算)', type: 'bar', stack: 'total', data: [16589, 4585, 3402], itemStyle: { color: '#5470c6' } },
    { name: '其他(score/elite/sample)', type: 'bar', stack: 'total', data: [18, 66, 34], itemStyle: { color: '#91cc75' } }
  ]
});

// 图3：NPU 每步细粒度开销（异构 vs 全量）
var c3 = echarts.init(document.getElementById('chart3'));
c3.setOption({
  backgroundColor: 'transparent',
  tooltip: { trigger: 'axis', triggerOn: 'mousemove|click', renderMode: 'richText', confine: true },
  legend: { data: ['NPU异构(方案A)', 'NPU全量'], top: 5 },
  grid: { left: 60, right: 40, top: 50, bottom: 40, containLabel: true },
  xAxis: { type: 'category', data: ['输入搬运\n(transfer_in)', 'NPU推理\n(inference)', '输出搬运\n(transfer_out)', '每步合计'] },
  yAxis: { type: 'value', name: '延迟 (ms)', nameLocation: 'middle', nameGap: 45 },
  series: [
    { name: 'NPU异构(方案A)', type: 'bar', data: [0.083, 22.558, 0.276, 22.917], itemStyle: { color: '#5470c6' }, label: { show: true, position: 'top', formatter: '{c}ms' } },
    { name: 'NPU全量', type: 'bar', data: [0.211, 30.146, 0.732, 31.089], itemStyle: { color: '#ee6666' }, label: { show: true, position: 'top', formatter: '{c}ms' } }
  ],
  graphic: [
    { type: 'text', left: '65%', top: '20%', style: { text: '全量模式 predictor 变慢 33%', fontSize: 13, fontWeight: 'bold', fill: '#ee6666' } },
    { type: 'text', left: '65%', top: '30%', style: { text: '(双NPU模型交替推理上下文切换)', fontSize: 11, fill: '#999' } },
    { type: 'text', left: '65%', top: '45%', style: { text: '数据搬运占比: 异构 1.6% / 全量 3.0%', fontSize: 12, fill: '#666' } }
  ]
});

// 图4：NPU 模式下 CPU 性能下降幅度
var c4 = echarts.init(document.getElementById('chart4'));
c4.setOption({
  backgroundColor: 'transparent',
  tooltip: { trigger: 'axis', triggerOn: 'mousemove|click', renderMode: 'richText', confine: true, axisPointer: { type: 'shadow' } },
  legend: { data: ['纯CPU模式', 'NPU异构模式', 'NPU全量模式'], top: 5 },
  grid: { left: 60, right: 40, top: 50, bottom: 40, containLabel: true },
  xAxis: { type: 'value', name: '延迟 (ms)', nameLocation: 'middle', nameGap: 45 },
  yAxis: { type: 'category', data: ['tensor_prep', 'cem_sample', 'elite_select', 'score', 'vi_enc(视觉编码)', 'action_encoder(CPU)'] },
  series: [
    { name: '纯CPU模式', type: 'bar', data: [1.9, 3.7, 5.4, 8.6, 3914, 2982], itemStyle: { color: '#91cc75' }, label: { show: true, position: 'right', formatter: '{c}ms' } },
    { name: 'NPU异构模式', type: 'bar', data: [4.0, 5.6, 7.8, 20.5, 5151, 4897], itemStyle: { color: '#fac858' }, label: { show: true, position: 'right', formatter: '{c}ms' } },
    { name: 'NPU全量模式', type: 'bar', data: [8.7, 16.5, 17.4, 31.8, 7334, '-'], itemStyle: { color: '#ee6666' }, label: { show: true, position: 'right', formatter: function(p) { return p.value === '-' ? '' : p.value + 'ms'; } } }
  ],
  graphic: [
    { type: 'text', left: '60%', top: '15%', style: { text: 'NPU 推理导致 CPU 性能下降', fontSize: 14, fontWeight: 'bold', fill: '#ee6666' } },
    { type: 'text', left: '60%', top: '25%', style: { text: '异构: vi_enc +32%, action_enc +64%', fontSize: 11, fill: '#666' } },
    { type: 'text', left: '60%', top: '33%', style: { text: '全量: vi_enc +87%, 其他 +100~200%', fontSize: 11, fill: '#666' } },
    { type: 'text', left: '60%', top: '45%', style: { text: '疑似原因: 内存带宽竞争 / 发热降频', fontSize: 11, fill: '#999' } }
  ]
});

window.addEventListener('resize', function() { c1.resize(); c2.resize(); c3.resize(); c4.resize(); });
</script>
</body>
</html>

defaults:
  - launcher: local
  - solver: cem
  - _self_

world:
  env_name: swm/ReacherDMControl-v0
  num_envs: ${eval.num_eval}
  max_episode_steps: ??? # make sure it's >= eval_budget
  history_size: 1
  frame_skip: 1
  task: qpos_match

dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
    - action

seed: 42
policy: Fast-lewm_weights.ckpt # ckpt name or random

plan_config:
  horizon: 1
  receding_horizon: 1
  action_num_blocks: 5 
  action_num_blocks_per_step: [2, 3]
  action_block_size: 5
  consistency_loss_weight: 0.0

# evaluation from dataset (replay expert trajectories)
eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 224
  dataset_name: dmc/reacher_random

  dataset_path: null # optional absolute/relative path to dataset file
  ckpt_path: null # optional absolute/relative path to checkpoint file
  callables:
    # -- set state
    - method: set_state
      args:
        qpos:
          value: qpos
        qvel:
          value: qvel

    - method: set_target_qpos
      args:
        target_qpos:
          value: goal_qpos

output:
  filename: dmc_results.txt

